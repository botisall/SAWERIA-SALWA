<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4 Saweria Widget</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      gap: 4px;
      padding: 4px;
      background: #000;
    }

    .box {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="box">
      <iframe
        src="https://saweria.co/widgets/alert?streamKey=796b5c2722989a57c1eea82c9fba08e0"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <div class="box">
      <iframe
        src="https://saweria.co/widgets/mediashare?streamKey=796b5c2722989a57c1eea82c9fba08e0"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <div class="box">
      <iframe
        src="https://saweria.co/widgets/leaderboard?streamKey=796b5c2722989a57c1eea82c9fba08e0"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <div class="box">
      <iframe
        src="https://saweria.co/widgets/recent?streamKey=796b5c2722989a57c1eea82c9fba08e0"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</body>
</html>
